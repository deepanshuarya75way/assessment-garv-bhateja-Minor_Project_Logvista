services:
  - type: web
    name: logvista-backend
    env: python
    region: oregon
    plan: free
    rootDir: Logvista2/backend_2
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
